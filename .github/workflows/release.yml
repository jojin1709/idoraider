name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Upload Assets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
            pkg: zip
          - goos: linux
            goarch: amd64
            ext: ""
            pkg: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ""
            pkg: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ""
            pkg: tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p build/templates
          cp -r templates/* build/templates/
          cp LICENSE README.md build/
          CGO_ENABLED=0 go build -ldflags="-s -w" -o build/idoraider${{ matrix.ext }} ./cmd/idoraider

      - name: Package archive (zip)
        if: matrix.pkg == 'zip'
        run: |
          cd build
          zip -r ../idoraider_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip .
          cd ..

      - name: Package archive (tar.gz)
        if: matrix.pkg == 'tar.gz'
        run: |
          cd build
          tar -czvf ../idoraider_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz .
          cd ..

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            idoraider_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.*

