id: idor-password-reset
name: Account Password Reset Token Exposure
severity: critical
description: User password reset tokens or secret pins accessible via user ID
method: GET
path: /api/v1/users/{id}/reset-token
headers:
  Authorization: Bearer {token}
ids:
  - 1
  - 2
  - 101
match_status:
  - 200
match_not_status:
  - 401
  - 403
  - 404
match_words:
  - token
  - reset
  - expires
